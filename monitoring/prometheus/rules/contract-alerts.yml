groups:
  - name: quantapool-native
    rules:
      - alert: ContractExporterDown
        expr: up{job="contract-exporter"} == 0 or absent(up{job="contract-exporter"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Native pool exporter is unreachable or missing from monitoring
      - alert: NativePoolVerifierUnavailable
        expr: quantapool_native_finality_status > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Native pool finality needs catch-up or has permanently expired
      - alert: NativePoolRecoveryActive
        expr: quantapool_native_recovering == 1
        labels:
          severity: critical
        annotations:
          summary: Native pool is distributing recovery cash
      - alert: NativePoolRecoveryAvailable
        expr: quantapool_native_pool_status == 2 and quantapool_native_recovering == 0
        labels:
          severity: critical
        annotations:
          summary: Verification or complete pool accounting expired; permissionless cash recovery is available
      - alert: NativePoolMetricsStale
        expr: |
          (time() - quantapool_native_last_success_timestamp_seconds{job="contract-exporter"} > 120)
          or
          (up{job="contract-exporter"} == 1 unless on (job, instance)
            quantapool_native_last_success_timestamp_seconds{job="contract-exporter"})
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Complete native pool metrics have stopped updating
      - alert: NativePoolFeeConfigurationMismatch
        expr: quantapool_native_fee_bps != 1000
        labels:
          severity: critical
        annotations:
          summary: Configured pool differs from the fixed 10 percent fee design
